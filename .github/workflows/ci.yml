name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Hermetic gate: no secrets, no network. This is the required check.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Parse every workflow file. An unparseable workflow fails SILENTLY:
      # GitHub keeps the old registered definition, shows the file path instead
      # of the `name:`, refuses workflow_dispatch, and simply never runs the
      # thing on its schedule. submission-review.yml shipped broken this way (a
      # heredoc body at column 0 terminated a `run: |` block scalar) and every
      # other check here was green, because nothing looks at these files.
      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = False
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  doc = yaml.safe_load(open(f))
              except Exception as e:
                  print(f'::error file={f}::unparseable: {e}'); bad = True; continue
              # `on:` parses as the boolean True in YAML 1.1 — check both.
              if not doc.get('name'):
                  print(f'::error file={f}::missing top-level name:'); bad = True
              if not (doc.get('on') or doc.get(True)):
                  print(f'::error file={f}::missing trigger block'); bad = True
              print(f'ok {f}')
          sys.exit(1 if bad else 0)
          PY

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  # E2E needs a built app + Supabase env. This was `continue-on-error: true`
  # pending the repo's secrets — those have been wired since 2026-07-01, and
  # leaving it on outlived its purpose badly: the login test broke on 2026-07-27
  # and every run for the next three days still reported success, so four
  # merges landed against a suite that was red. A check that cannot fail is
  # worse than no check, because it reads as coverage.
  #
  # Now allowed to fail the run, and `main` branch protection requires BOTH
  # `quality` and `e2e` (verified 2026-08-03: required_status_checks.contexts
  # = ["quality", "e2e"]). A red e2e run therefore hard-blocks the merge; the
  # only way past it is an admin override, which is what PR #94 needed. An
  # earlier version of this comment claimed main had no branch protection and
  # that this job was non-blocking. That was wrong, and it cost a debugging
  # cycle. If you make e2e non-blocking, change the protection rule too, not
  # just this comment.
  #
  # Consequence worth knowing: the concurrency group below can cancel a queued
  # e2e run outright, which leaves the required check unreported and the PR
  # unmergeable until it is re-run. Acceptable at today's PR volume.
  e2e:
    runs-on: ubuntu-latest
    # All e2e runs share one production DATABASE_URL for fixture seed/cleanup
    # (scripts/seed-e2e-fixtures.mjs) — a single global group (not per-ref)
    # guarantees at most one run ever executes seed/cleanup at a time, so two
    # overlapping runs can never delete each other's still-in-use fixture
    # rows. Note: GitHub Actions only queues one *pending* run per group — a
    # third overlapping trigger cancels the still-queued second one outright
    # rather than queuing indefinitely, so under heavy overlap some pushes
    # may see e2e skipped entirely for that commit. Since e2e IS a required
    # check (see above), a cancelled run must be re-run before the PR can
    # merge. Acceptable at today's low PR volume; revisit if that changes.
    concurrency:
      group: e2e-shared-fixture-db
      cancel-in-progress: false
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      # hashIp() HMACs IPs with this and throws without it, so the routes that
      # rate-limit (/api/mcp, /api/agentauth, /api/github-meta) 500 if it is
      # unset. CI only needs *a* stable value — the digests it produces are
      # thrown away with the ephemeral run — so the placeholder is fine here and
      # must never be the production value. Same fallback shape as the two above.
      RATE_LIMIT_IP_SALT: ${{ secrets.RATE_LIMIT_IP_SALT || 'placeholder-ci-salt' }}
      # Postgres connection for scripts/seed-e2e-fixtures.mjs and
      # tests/e2e/global-teardown.mjs — bypasses RLS, so no auth session is
      # needed to seed/clean up forum_threads/agents fixture rows.
      #
      # Must be the Supabase *pooler* connection string (port 6543,
      # aws-0-<region>.pooler.supabase.com), not the direct db.<ref>.supabase.co
      # one used locally in .env.local: the direct host resolves to an
      # IPv6-only address with no A record, and GitHub-hosted runners have no
      # IPv6 egress — a direct DATABASE_URL fails with ENETUNREACH here.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
